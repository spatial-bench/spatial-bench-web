name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-core
          path: engine

      - name: Checkout the results repo
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-results
          path: results

      - name: Install the toolchain for the collator
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build the collator
        run: cargo build --release -p spatial-bench
        working-directory: engine

      - name: Build the dataset fixture
        run: |
          mkdir -p .fixture
          engine/target/release/spatial-bench publish \
            --results results \
            --out .fixture/benchmarks-test.sqlite --sha local
          node scripts/fixture.mjs .fixture/benchmarks-test.sqlite .fixture

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
